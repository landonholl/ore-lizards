plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		orelizards {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// GeckoLib publishes its own example mod inside the release jar - entrypoints
	// software.bernie.example.GeckoLibMod and .ClientListener - and registers it whenever
	// FabricLoader.isDevelopmentEnvironment() is true. One of those examples replaces the vanilla
	// creeper renderer with a GeoReplacedEntityRenderer, which casts the Creeper to IAnimatable and
	// crashes the client with a ClassCastException the moment a creeper comes into view; the rest
	// register example entities that log "No data fixer registered for ..." on both sides. The
	// examples check the geckolib.disable_examples system property (GeckoLibMod's own
	// DISABLE_EXAMPLES_PROPERTY_KEY, spelled identically on GeckoLib 3.x and 4.x), so setting it
	// here disarms them. This only affects runClient/runServer: outside a dev environment the
	// examples never register at all, so the published jar was never affected.
	//
	// EncounterDirector reads three of its own properties once at startup, all optional and all
	// off by default. Uncomment for a test session rather than editing constants:
	//   orelizards.director.budgetSeconds - overrides both budget bounds, so '30' runs the whole
	//     place/deliver/abandon loop in half a minute instead of 20-60 minutes.
	//   orelizards.director.debug - logs every decision: eligibility, budget, candidate count,
	//     per-candidate score and rejection reason, the chosen position, the abandon reason, and a
	//     running hit/miss tally. That tally is the only way to measure how often a placement is
	//     actually walked into, which is the one number the cadence maths can't derive.
	//   orelizards.director.skipSightCheck - accepts candidates without the clear-line-of-sight
	//     test, to exercise the sweep on its own.
	runs {
		client {
			property 'geckolib.disable_examples', 'true'
			 property 'orelizards.director.budgetSeconds', '30'
			 property 'orelizards.director.debug', 'true'
			// property 'orelizards.director.skipSightCheck', 'true'
		}

		server {
			property 'geckolib.disable_examples', 'true'
			// property 'orelizards.director.budgetSeconds', '30'
			// property 'orelizards.director.debug', 'true'
			// property 'orelizards.director.skipSightCheck', 'true'
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GeckoLib - animation library for the buried/erupt/flee/dig-down state machine
	modImplementation "${project.geckolib_version}"

	// GeckoLib bundles this as a jar-in-jar (see its fabric.mod.json "jars" entry), but the
	// current Loom 1.17 dev-launch classpath isn't picking that nested jar up, causing
	// software.bernie.geckolib.util.JsonUtil to fail NoClassDefFoundError at runClient startup.
	// Extracted straight out of the GeckoLib jar (META-INF/jars/mclib-20.jar) as a workaround.
	implementation files('libs/mclib-20.jar')
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
