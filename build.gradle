plugins {
	// Minecraft 26.x ships unobfuscated, so this is Loom's non-remapping plugin id (net.fabricmc.fabric-loom),
	// not net.fabricmc.fabric-loom-remap: there is no mappings dependency and no remap step anywhere.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		orelizards {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No `mappings` line: Mojang publishes 26.x with its official names already in the jar.
	// The non-remapping Loom plugin has no modImplementation configuration either - mods are plain
	// implementation dependencies, and Loom still picks their fabric.mod.json / class tweakers up from there.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GeckoLib - animation library for the buried/erupt/flee/dig-down state machine
	implementation "${project.geckolib_version}"
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Minecraft 26.x (26.1.2 here) runs on Java 25. The toolchain makes Gradle compile with, and launch runServer/runClient
	// on, a JDK 25 even when the Gradle daemon itself is on an older JVM (Gradle auto-detects the JDKs it has
	// provisioned under ~/.gradle/jdks).
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
