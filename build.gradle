plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		orelizards {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// GeckoLib publishes its own example mod inside the release jar - entrypoints
	// software.bernie.example.GeckoLibMod and .ClientListener - and registers it whenever
	// FabricLoader.isDevelopmentEnvironment() is true. One of those examples replaces the vanilla
	// creeper renderer with a GeoReplacedEntityRenderer, which casts the Creeper to IAnimatable and
	// crashes the client with a ClassCastException the moment a creeper comes into view; the rest
	// register example entities that log "No data fixer registered for ..." on both sides. The
	// examples check the geckolib.disable_examples system property (GeckoLibMod's own
	// DISABLE_EXAMPLES_PROPERTY_KEY, spelled identically on GeckoLib 3.x and 4.x), so setting it
	// here disarms them. This only affects runClient/runServer: outside a dev environment the
	// examples never register at all, so the published jar was never affected.
	runs {
		client {
			property 'geckolib.disable_examples', 'true'
		}

		server {
			property 'geckolib.disable_examples', 'true'
		}
	}
}

// GeckoLib 3.0.x cannot be remapped to Mojang mappings as shipped. GeoProjectilesRenderer declares
// both its own IGeoRenderer.getTextureLocation(Entity) and an override of
// EntityRenderer.getTextureLocation(Entity) (intermediary method_3931). Under Yarn those are two
// differently named methods; under Mojmap both want the name getTextureLocation with the same
// descriptor, which Tiny Remapper reports as an unfixable name conflict and Loom's dependency remap
// aborts on ("Failed to remap 48 mods"). Loom exposes no ignoreConflicts switch for dependency
// remapping, and the override is a one-line delegate to the other method - so this rewrites the
// Modrinth artifact with that single method removed. Once remapped, the surviving method *is* the
// override, and nothing else in the jar changes. It has to happen here, at configuration time,
// because Loom remaps mod dependencies while the project is being configured, so the patched file
// must already exist. GeckoLib 3.1+ renamed its method to getTextureResource, so only 3.0.x needs
// this. The upstream coordinate is still what gradle.properties declares - this only changes how
// the dev classpath copy is prepared, not what players install.
//
// The artifact is fetched by hand rather than through a Gradle configuration: resolving anything
// this early freezes every repository's descriptor, and Loom then fails with "Cannot mutate content
// repository descriptor 'LoomLocalRemappedMods' after repository has been used" when it tries to
// finish setting up its own. Gradle's module cache is checked first, then the Modrinth maven.
// Everything lands in .gradle/geckolib-mojmap/ (ignored by git); delete that directory to redo the
// patch, and bump the revision suffix if the patch itself changes.
class DropMethodVisitor extends org.objectweb.asm.ClassVisitor {
	private final String methodName
	private final String methodDescriptor

	DropMethodVisitor(org.objectweb.asm.ClassVisitor next, String methodName, String methodDescriptor) {
		super(org.objectweb.asm.Opcodes.ASM9, next)
		this.methodName = methodName
		this.methodDescriptor = methodDescriptor
	}

	@Override
	org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
		if (name == methodName && descriptor == methodDescriptor) {
			return null
		}
		return super.visitMethod(access, name, descriptor, signature, exceptions)
	}
}

def geckolibMojmapJar = { ->
	String[] coordinate = project.geckolib_version.split(':')
	String group = coordinate[0]
	String name = coordinate[1]
	String version = coordinate[2]
	File cacheDir = new File(project.projectDir, '.gradle/geckolib-mojmap')
	File raw = new File(cacheDir, "${name}-${version}.jar")
	File out = new File(cacheDir, "${name}-${version}-mojmap-r1.jar")
	if (out.isFile() && out.length() > 0) {
		return out
	}
	cacheDir.mkdirs()
	if (!raw.isFile() || raw.length() == 0) {
		File moduleCacheDir = new File(project.gradle.gradleUserHomeDir, "caches/modules-2/files-2.1/${group}/${name}/${version}")
		File cached = moduleCacheDir.isDirectory()
				? moduleCacheDir.listFiles().collect { new File(it, raw.name) }.find { it.isFile() && it.length() > 0 }
				: null
		if (cached != null) {
			java.nio.file.Files.copy(cached.toPath(), raw.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		} else {
			String url = "https://api.modrinth.com/maven/${group.replace('.', '/')}/${name}/${version}/${raw.name}"
			logger.lifecycle("Ore Lizards: downloading ${url}")
			raw.bytes = new URI(url).toURL().bytes
		}
	}
	String conflictingClass = 'software/bernie/geckolib3/renderers/geo/GeoProjectilesRenderer.class'
	String conflictingMethod = 'method_3931'
	String conflictingDescriptor = '(Lnet/minecraft/class_1297;)Lnet/minecraft/class_2960;'
	File tmp = new File(out.parentFile, out.name + '.tmp')
	new java.util.zip.ZipFile(raw).withCloseable { zip ->
		new java.util.zip.ZipOutputStream(new FileOutputStream(tmp)).withCloseable { zos ->
			for (java.util.zip.ZipEntry entry : zip.entries()) {
				// A modified class would fail any jar signature check, so signature files can't be kept.
				if (entry.name ==~ /META-INF\/[^\/]+\.(SF|RSA|DSA|EC)/) {
					continue
				}
				byte[] data = zip.getInputStream(entry).bytes
				if (entry.name == conflictingClass) {
					def reader = new org.objectweb.asm.ClassReader(data)
					def writer = new org.objectweb.asm.ClassWriter(reader, 0)
					reader.accept(new DropMethodVisitor(writer, conflictingMethod, conflictingDescriptor), 0)
					data = writer.toByteArray()
				}
				zos.putNextEntry(new java.util.zip.ZipEntry(entry.name))
				zos.write(data)
				zos.closeEntry()
			}
		}
	}
	java.nio.file.Files.move(tmp.toPath(), out.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	return out
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GeckoLib - animation library for the buried/erupt/flee/dig-down state machine. Resolved from
	// the coordinate in gradle.properties, then patched for Mojang mappings - see geckolibMojmapJar.
	modImplementation files(geckolibMojmapJar())

	// GeckoLib 3.0.80 shades mclib into software.bernie.shadowed.eliotlash.mclib and nothing in it
	// references the copy it also nests as META-INF/jars/mclib-20.jar, so the libs/mclib-20.jar
	// workaround the 1.20.1 build needs does not apply here.
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}

	// Downgrade the animation keyframes to the shape GeckoLib 3 can read. Blockbench writes each
	// keyframe as {"post": {"vector": [x,y,z]}, "lerp_mode": "catmullrom"}; GeckoLib 3's
	// JsonKeyFrameUtils.getKeyFrameVector only accepts a bare [x,y,z] array or {"vector": [x,y,z]}
	// (plus optional "easing"/"easingArgs"), and it has no concept of pre/post or lerp_mode at all -
	// grep the jar and neither string is in it. Handed the newer shape it finds no vector, reads
	// zero keyframes, and animates nothing, silently: the controller still reports the animation as
	// running with its clock advancing, and the model just sits in its bind pose. That is the
	// "statue" bug. Every pre/post pair the export emits holds the same vector, so collapsing to
	// post loses no motion; catmullrom smoothing is lost, leaving GeckoLib 3's linear interpolation.
	// Done here rather than by editing the asset so src/main/resources stays byte-identical to
	// main's - a future re-export can be copied straight across without silently breaking this.
	doLast {
		File animFile = new File(destinationDir, 'assets/orelizards/animations/entity/ore_lizard.animation.json')
		if (animFile.exists()) {
			def json = new groovy.json.JsonSlurper().parseText(animFile.text)
			int collapsed = downgradeKeyframes(json)
			animFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
			logger.lifecycle("GeckoLib 3 keyframe downgrade: collapsed ${collapsed} keyframe(s) in ${animFile.name}")
		}
	}
}

/**
 * Rewrites every {"post": ..., "lerp_mode": ...} keyframe in place as {"vector": [x,y,z]}, and drops
 * a stray "lerp_mode" from anything else. Returns how many keyframes were rewritten. Anything already
 * in a shape GeckoLib 3 understands - a bare array, or a map that carries "vector" itself, such as
 * the single static value the "idle" animation holds - is left exactly as it is.
 */
int downgradeKeyframes(Object node) {
	int count = 0
	if (node instanceof Map) {
		if (node.containsKey('post')) {
			def post = node.remove('post')
			node.remove('pre')
			node.remove('lerp_mode')
			node.clear()
			node.put('vector', (post instanceof Map) ? post.get('vector') : post)
			return 1
		}
		node.remove('lerp_mode')
		for (value in new ArrayList(node.values())) {
			count += downgradeKeyframes(value)
		}
	} else if (node instanceof List) {
		for (value in node) {
			count += downgradeKeyframes(value)
		}
	}
	return count
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
